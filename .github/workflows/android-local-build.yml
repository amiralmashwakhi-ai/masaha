# Builds the Android test app on GitHub's own servers (no Expo build quota) and attaches the APK
# to a pre-release on this repository. Needs the EXPO_TOKEN repository secret for the signing key.
name: Android test build (GitHub)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Link the Expo project
        run: npx eas-cli@latest init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Build Android APK locally
        run: npx eas-cli@latest build --platform android --profile preview --local --non-interactive --output masaha.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Attach the APK to a pre-release
        run: gh release create "test-${{ github.run_number }}" masaha.apk --prerelease --title "Test build ${{ github.run_number }}" --notes "Android test build from ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
